name: ValoArts Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoarts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh checkout to latest saved state
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - name: Install requirements
        run: pip install -r requirements.txt Pillow

      - name: Run bot
        env:
          VALOARTS_MAX_RUN_SECONDS: "870"
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RULE34_API_KEY: ${{ secrets.RULE34_API_KEY }}
          RULE34_USER_ID: ${{ secrets.RULE34_USER_ID }}
        run: python bot.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f state.json ]; then
            echo "state.json missing; nothing to save"
            exit 0
          fi
          cp state.json "$RUNNER_TEMP/valoarts-local-state.json"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            # Rebuild the state on the latest remote commit, so a push race
            # never silently discards successfully sent IDs.
            python - "$RUNNER_TEMP/valoarts-local-state.json" <<'PYMERGE'
          import json, subprocess, sys
          from pathlib import Path
          local = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          remote_bytes = subprocess.run(
              ["git", "show", "FETCH_HEAD:state.json"],
              capture_output=True, check=False,
          )
          remote = json.loads(remote_bytes.stdout) if remote_bytes.returncode == 0 else {}
          local_epoch = int(local.get("history_reset_epoch", 0))
          remote_epoch = int(remote.get("history_reset_epoch", 0))
          if local_epoch > remote_epoch:
              # A reset was requested during this run: use the reset history.
              merged = dict(remote)
              merged.update(local)
          elif remote_epoch > local_epoch:
              # A stale workflow must not restore IDs cleared by a newer reset.
              merged = dict(local)
              merged.update(remote)
          else:
              merged = dict(remote)
              merged.update(local)
              ids = {str(x) for x in remote.get("sent_ids", [])}
              ids.update(str(x) for x in local.get("sent_ids", []))
              merged["sent_ids"] = sorted(ids, key=lambda x: int(x))
              cursors = [v for v in (remote.get("last_post_id"), local.get("last_post_id")) if v is not None]
              if cursors:
                  merged["last_post_id"] = max(int(v) for v in cursors)
          Path("state.json").write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PYMERGE
            git add state.json
            if git diff --cached --quiet; then
              echo "No new state changes"
              exit 0
            fi
            # Commit on top of the latest remote tip, not the checkout's stale base.
            git reset --mixed FETCH_HEAD
            git add state.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update post history" || true
            if git push origin "HEAD:$branch"; then
              echo "state.json saved successfully"
              exit 0
            fi
            echo "Push conflict (attempt $attempt/5); retrying"
            sleep 2
          done
          echo "Could not save state.json after 5 attempts" >&2
          exit 1

      - name: Notify admin if GitHub Actions fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          admin_id = os.environ.get("TELEGRAM_ADMIN_ID", "").strip()
          if not token or not admin_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_ADMIN_ID secret")

          payload = json.dumps({
              "chat_id": admin_id,
              "text": "⚠️ ValoArtsBot: запуск GitHub Actions завершился ошибкой. Открой вкладку Actions в репозитории и проверь журнал выполнения.",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected failure notification: {result}")
          print("Failure notification sent to administrator")
          PY
